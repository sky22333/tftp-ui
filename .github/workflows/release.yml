name: 发布 TFTP 服务端

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签（如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验标签格式
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v?\d+\.\d+\.\d+([-+][0-9A-Za-z.\-]+)*$') {
            Write-Host "::error::标签格式不合法：$env:TAG，期望 v1.0.0 或 1.0.0"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: 编译
        run: cargo build --release --locked

      - name: 校验静态 CRT
        shell: pwsh
        run: |
          $exe = 'target/release/tftp-ui.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::未找到 $exe"; exit 1 }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $exe)))
          foreach ($dll in 'VCRUNTIME140', 'MSVCP140', 'ucrtbase', 'api-ms-win-crt') {
            if ($text.Contains($dll)) { Write-Host "::error::检测到动态依赖 $dll"; exit 1 }
          }

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tftp-ui.exe dist/tftp-ui.exe
          $hash = (Get-FileHash 'dist/tftp-ui.exe' -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/tftp-ui.exe.sha256", "$hash  tftp-ui.exe")

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: TFTP 服务端 ${{ inputs.tag }}
          files: |
            dist/tftp-ui.exe
            dist/tftp-ui.exe.sha256
          body: |
            轻量 TFTP 服务端，Windows x64 单 exe

            **使用**：双击运行 → 选网卡与文件目录 → 启动服务
