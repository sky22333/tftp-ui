[package]
name = "tftp-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "扁平化 TFTP 服务端小工具"

[dependencies]
async-tftp = "0.4.2"
blocking = "1.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
if-addrs = "0.15.0"
rfd = "0.17.2"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[build-dependencies]
embed-resource = "3.0"
slint-build = "1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
